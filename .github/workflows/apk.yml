name: APK Faso Kanou

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Godot et les modèles d'export
        run: |
          cd $RUNNER_TEMP
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          chmod +x godot
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Configurer Android
        run: |
          keytool -genkeypair -keystore $RUNNER_TEMP/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          $RUNNER_TEMP/godot --headless --editor --quit || true
          F=$(ls ~/.config/godot/editor_settings-*.tres | head -1)
          echo "export/android/android_sdk_path = \"$ANDROID_SDK_ROOT\"" >> "$F"
          echo "export/android/java_sdk_path = \"$JAVA_HOME\"" >> "$F"

      - name: Exporter l'APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          $RUNNER_TEMP/godot --headless --import || true
          $RUNNER_TEMP/godot --headless --export-debug "Android" build/FasoKanou.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FasoKanou-apk
          path: build/FasoKanou.apk
